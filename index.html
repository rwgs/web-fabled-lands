<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Fabled Lands</title>
  <!-- The app lives in /web. This lets you serve the repository root directly
       (e.g. `python -m http.server` here) and still land in the game. -->
  <meta http-equiv="refresh" content="0; url=web/" />
  <link rel="canonical" href="web/" />
  <style>
    html, body { margin: 0; height: 100%; background: #2b1a0f; color: #e0b34a;
      font-family: Georgia, "Times New Roman", serif; display: flex; align-items: center; justify-content: center; }
    a { color: #e0b34a; }
  </style>
</head>
<body>
  <p>Entering the <a href="web/">Fabled Lands</a>…</p>
  <!-- Carry the incoming query and hash across, so the documented deep links keep working
       when the site is opened at its canonical root: `/?seed=42&demo=1.10` has to become
       `/web/?seed=42&demo=1.10`, not `/web/`. A bare 'web/' built a new relative URL and
       dropped both, so app.js never saw them and the link opened the title screen with
       ordinary random dice. Relative on purpose — it must also work from a subpath. The
       <meta refresh> and the <a> above stay as the no-script fallback; neither can preserve
       the URL, which is why the script path is the one that carries it. (task 346) -->
  <script>location.replace('web/' + location.search + location.hash);</script>
</body>
</html>
